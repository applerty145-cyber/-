<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜架高床歷年作品集</title>
    <style>
        /* 載入您上傳的日系手寫字體 */
        @font-face {
            font-family: 'CheckpointFont';
            src: url('checkpoint.otf') format('truetype');
            font-display: swap;
        }

        body { 
            font-family: 'CheckpointFont', sans-serif; /* 換成新字體 */
            background-color: #fafafa; 
            /* 日系藍色網格背景 */
            background-image: 
                linear-gradient(rgba(176, 196, 222, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 196, 222, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0; 
            padding: 20px; 
            -webkit-tap-highlight-color: transparent; 
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header-logo { 
            max-width: 180px; 
        }
        .main-title { 
            color: #333; 
            font-size: 2.5rem; 
            text-align: center; 
            margin: 30px 0 40px 0; 
            letter-spacing: 2px;
            white-space: nowrap; /* 強制絕對不換行 */
        }

        /* 【行動裝置修正】防標題擠到第二行 */
        @media (max-width: 767px) {
            .main-title {
                font-size: 1.6rem; /* 手機版自動縮小字體，完美塞在同一行 */
                letter-spacing: 1px;
            }
        }

        .gallery-container {
            display: flex;
            justify-content: center;
            padding: 0 10px;
        }
        .card { 
            background: #fff; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); 
            cursor: pointer; 
            text-decoration: none;
            display: block;
            max-width: 600px; 
            width: 100%;
            transition: transform 0.2s;
            padding: 10px; 
            box-sizing: border-box;
        }
        .card:hover {
            transform: translateY(-5px) rotate(-1deg); 
        }
        .card img { 
            width: 100%; 
            aspect-ratio: 4/3; 
            object-fit: cover; 
            display: block;
            border-radius: 4px;
        }
        .card-title {
            color: #333;
            text-align: center;
            font-size: 1.5rem;
            font-weight: normal; 
            padding: 15px 10px 5px 10px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="0-logo-02.png" alt="添興家具" class="header-logo">
    </div>

    <h1 class="main-title">架高床歷年作品集</h1>

    <div class="gallery-container">
        <a href="B1.html?v=3" class="card">
            <img src="1.jpg" alt="客製架高床預覽圖">
            <h2 class="card-title">2025/10 客製架高床</h2>
        </a>
    </div>

</body>
</html>
