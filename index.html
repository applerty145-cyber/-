<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜架高床歷年作品集</title>
    <style>
        @font-face {
            font-family: 'CheckpointFont';
            src: url('checkpoint.ttf') format('truetype');
            font-display: swap;
        }

        body { 
            font-family: 'CheckpointFont', sans-serif; 
            background-color: #fafafa; 
            background-image: 
                linear-gradient(rgba(176, 196, 222, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 196, 222, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            /* [修改] margin 改為 0，這樣頁首頁尾才能完美貼齊兩邊不留白邊 */
            margin: 0; 
            padding: 0 0 40px 0; /* 底部留空間給頁尾 */
            -webkit-tap-highlight-color: transparent; 
        }

        /* 頁首與頁尾的深藍色紙質感樣式 */
        .site-header-bar, .site-footer-bar {
            width: 100%;
            height: 35px; /* 可以依喜好調整色塊粗細 */
            background-color: #1e3d6b; /* 深藍色底層 */
            /* 疊加和紙質感的微細針孔與纖維紋理 */
            background-image: 
                radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0),
                radial-gradient(rgba(0,0,0,0.1) 1px, transparent 0);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2); /* 讓紙張邊緣有一點內陰影立體感 */
        }
        
        .site-header-bar {
            margin-bottom: 20px;
        }

        .site-footer-bar {
            margin-top: 60px;
        }

        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header-logo { 
            max-width: 180px; 
        }
        .main-title { 
            color: #333; 
            font-size: 2.5rem; 
            text-align: center; 
            margin: 30px 0 40px 0; 
            letter-spacing: 2px;
            white-space: nowrap; 
        }

        @media (max-width: 767px) {
            .main-title {
                font-size: 1.6rem; 
                letter-spacing: 1px;
            }
        }

        .gallery-container {
            display: flex;
            justify-content: center;
            padding: 0 20px; /* 給左右留一點間距 */
        }
        .card { 
            background: #fff; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); 
            cursor: pointer; 
            text-decoration: none;
            display: block;
            max-width: 600px; 
            width: 100%;
            transition: transform 0.2s;
            padding: 10px; 
            box-sizing: border-box;
        }
        .card:hover {
            transform: translateY(-5px) rotate(-1deg); 
        }
        .card img { 
            width: 100%; 
            aspect-ratio: 4/3; 
            object-fit: cover; 
            display: block;
            border-radius: 4px;
        }
        .card-title {
            color: #333;
            text-align: center;
            font-size: 1.5rem;
            font-weight: normal; 
            padding: 15px 10px 5px 10px;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 頂端深藍色紙質色塊 -->
    <div class="site-header-bar"></div>

    <div class="header">
        <img src="0-logo-02.png" alt="添興家具" class="header-logo">
    </div>

    <h1 class="main-title">架高床歷年作品集</h1>

    <div class="gallery-container">
        <!-- 快取破壞版本號更新到 v=4 -->
        <a href="B1.html?v=4" class="card">
            <img src="1.jpg" alt="客製架高床預覽圖">
            <h2 class="card-title">2025/10 客製架高床</h2>
        </a>
    </div>

    <!-- 尾端深藍色紙質色塊 -->
    <div class="site-footer-bar"></div>

</body>
</html>
