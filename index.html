<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜架高床歷年作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            background-color: #f5efe6; 
            margin: 0; 
            padding: 20px; 
            -webkit-tap-highlight-color: transparent; 
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header-logo { 
            max-width: 180px; 
        }
        .main-title { 
            color: #4a3f35; 
            font-size: 2rem; 
            text-align: center; 
            margin: 30px 0 40px 0; 
        }
        .gallery-container {
            display: flex;
            justify-content: center;
            padding: 0 10px;
        }
        .card { 
            background: #fff; 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            cursor: pointer; 
            text-decoration: none;
            display: block;
            max-width: 400px;
            width: 100%;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img { 
            width: 100%; 
            aspect-ratio: 4/3; 
            object-fit: cover; 
            display: block;
        }
        .card-title {
            color: #4a3f35;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 20px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="0-logo-02.png" alt="添興家具" class="header-logo">
    </div>

    <h1 class="main-title">架高床歷年作品集</h1>

    <div class="gallery-container">
        <a href="B1.html?v=1" class="card">
            <img src="1.jpg" alt="客製架高床預覽圖">
            <h2 class="card-title">2025/10 客製架高床</h2>
        </a>
    </div>

</body>
</html>
