<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜架高床歷年作品集</title>
    <style>
        @font-face {
            font-family: 'CheckpointFont';
            src: url('checkpoint.ttf?v=2') format('truetype');
            font-display: swap;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'CheckpointFont', sans-serif; 
            color: #4a3c31; 
            background-color: #fafafa; 
            background-image: 
                linear-gradient(rgba(176, 196, 222, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 196, 222, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            -webkit-tap-highlight-color: transparent; 
            
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-content {
            flex: 1 0 auto;
        }

        .site-header-bar, .site-footer-bar {
            width: 100%;
            height: 35px; 
            background-color: #1e3d6b; 
            background-image: 
                radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0),
                radial-gradient(rgba(0,0,0,0.1) 1px, transparent 0);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2); 
            flex-shrink: 0;
        }
        
        .site-header-bar {
            margin-bottom: 20px;
        }

        .site-footer-bar {
            margin-top: 60px;
        }

        /* 修改後的 Logo 樣式：右上角絕對定位 */
        .header-logo { 
            position: absolute; 
            top: 55px; 
            right: 25px; 
            max-width: 120px; 
            z-index: 5;
        }

        /* 新增的開頭字卡樣式 */
        .hero-banner {
            display: block;
            width: 90%;
            max-width: 600px;
            margin: 110px auto 20px auto; /* 留出上方空間，避免被 Logo 遮擋 */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .main-title { 
            color: #846e5b; 
            font-size: 2.5rem; 
            text-align: center; 
            margin: 20px 0 40px 0; 
            letter-spacing: 2px; 
            white-space: nowrap; 
            font-weight: normal; 
        }

        @media (max-width: 767px) {
            .main-title {
                font-size: 1.6rem; 
                letter-spacing: 1px;
                margin: 15px 0 30px 0;
            }
            /* 手機版的 Logo 與字卡微調 */
            .hero-banner {
                margin: 100px auto 15px auto; 
            }
            .header-logo {
                max-width: 100px; 
                top: 50px;
                right: 15px;
            }
        }

        .gallery-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 0 20px 40px 20px; 
        }
       .card { 
            position: relative; /* 1. 新增：為了讓內部的白框能對齊這張卡片 */
            background: #5c7fa6; /* 2. 修改：換成較淺、帶點微霧感的日系藍色 */
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); 
            cursor: pointer; 
            text-decoration: none;
            display: block;
            max-width: 600px; 
            width: 100%;
            transition: transform 0.2s;
            padding: 12px; /* 3. 修改：稍微把外框加厚一點 (10px -> 12px)，讓白框有空間 */
            box-sizing: border-box;
        }

        /* ⭐ 新增這個區塊：利用偽元素在藍色裡面畫一圈白色細框 ⭐ */
        .card::before {
            content: "";
            position: absolute;
            top: 6px;    /* 距離卡片上邊緣 6px */
            bottom: 6px; /* 距離卡片下邊緣 6px */
            left: 6px;   /* 距離卡片左邊緣 6px */
            right: 6px;  /* 距離卡片右邊緣 6px */
            border: 1px solid #ffffff; /* 畫出 1px 的白色實線 */
            border-radius: 6px; /* 讓白框的四角也有一點圓弧，呼應外框 */
            pointer-events: none; /* 讓滑鼠點擊可以穿透它，避免影響連結功能 */
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-5px) rotate(-1deg); 
        }

        .card img { 
            width: 100%; 
            aspect-ratio: 4/3; 
            object-fit: cover; 
            display: block;
            border-radius: 4px 4px 0 0; /* 維持上方圓角，下方直角 */
            position: relative;
            z-index: 2; /* 確保圖片在白框上方，才不會被白線壓過 */
        }
        
        .card-title {
            background-color: #ffffff; /* 維持文字白底 */
            border-radius: 0 0 4px 4px; /* 維持下方圓角 */
            color: #4a3c31; 
            text-align: center;
            font-size: 1.5rem;
            margin: 0;
            padding: 15px 10px 15px 10px; 
            font-weight: normal; 
            position: relative;
            z-index: 2; /* 確保文字白底在白框上方 */
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="site-header-bar"></div>

        <img src="0-logo-02.png" alt="添興家具" class="header-logo">

        <img src="0-開頭字卡.png" alt="開頭字卡" class="hero-banner">

        <h1 class="main-title">客製作品分享</h1>

        <div class="gallery-container">
            <a href="B1.html" class="card">
                <img src="6.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">2025/10 客製雙層床</h2>
            </a>

            <a href="B7.html" class="card">
                <img src="7.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">2026/4 客製書桌櫃架高床</h2>
            </a>

            <a href="B11.html" class="card">
                <img src="13.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">2026/6 客製城堡架高床</h2>
            </a>
            
            <a href="B16.html" class="card">
                <img src="16.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">2026/6 客製收納衣櫃架高床</h2>
            </a>
        </div>
    </div>

    <div class="site-footer-bar"></div>

</body>
</html>
