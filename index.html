<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添興家具｜架高床歷年作品集</title>
    <style>
        @font-face {
            font-family: 'CheckpointFont';
            src: url('checkpoint.ttf?v=2') format('truetype');
            font-display: swap;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'CheckpointFont', sans-serif; 
            color: #4a3c31; 
            background-color: #fafafa; 
            background-image: 
                linear-gradient(rgba(176, 196, 222, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 196, 222, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            -webkit-tap-highlight-color: transparent; 
            
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-content {
            flex: 1 0 auto;
        }

        .site-header-bar, .site-footer-bar {
            width: 100%;
            height: 35px; 
            background-color: #1e3d6b; 
            background-image: 
                radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0),
                radial-gradient(rgba(0,0,0,0.1) 1px, transparent 0);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2); 
            flex-shrink: 0;
        }
        
        .site-header-bar {
            margin-bottom: 20px;
        }

        .site-footer-bar {
            margin-top: 60px;
        }

        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header-logo { 
            max-width: 180px; 
        }
        
        .main-title { 
            color: #4a3c31; 
            font-size: 2.5rem; 
            text-align: center; 
            margin: 30px 0 40px 0; 
            letter-spacing: 2px; 
            white-space: nowrap; 
            font-weight: normal; 
        }

        @media (max-width: 767px) {
            .main-title {
                font-size: 1.6rem; 
                letter-spacing: 1px;
            }
        }

        .gallery-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 0 20px 40px 20px; 
        }
        .card { 
            background: #fff; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); 
            cursor: pointer; 
            text-decoration: none;
            display: block;
            max-width: 600px; 
            width: 100%;
            transition: transform 0.2s;
            padding: 10px; 
            box-sizing: border-box;
        }
        .card:hover {
            transform: translateY(-5px) rotate(-1deg); 
        }
        .card img { 
            width: 100%; 
            aspect-ratio: 4/3; 
            object-fit: cover; 
            display: block;
            border-radius: 4px;
        }
        
        .card-title {
            color: #4a3c31; 
            text-align: center;
            font-size: 1.5rem;
            margin: 0;
            padding: 15px 10px 5px 10px;
            font-weight: normal; 
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="site-header-bar"></div>

        <div class="header">
            <img src="0-logo-02.png" alt="添興家具" class="header-logo">
        </div>

        <h1 class="main-title">架高床歷年作品集</h1>

        <div class="gallery-container">
            <!-- 第一個商品：B1 -->
            <a href="B1.html" class="card">
                <img src="6.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">2025/10 客製雙層床</h2>
            </a>

            <!-- 第二個商品：B7 -->
            <a href="B7.html" class="card">
                <img src="7.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">2026/4 客製書桌櫃架高床</h2>
            </a>

            <!-- 第三個商品：B11 (新增) -->
            <a href="B11.html" class="card">
                <img src="13.webp" alt="客製架高床預覽圖">
                <h2 class="card-title">2026/6 客製城堡架高床</h2>
            </a>
            

            <a href="B16.html" class="card">
                <img src="16.webp" alt="客製架高床預覽圖">
            <h2 class="card-title">2026/6 客製收納衣櫃架高床</h2>
            </a>
        </div>
    </div>

    <div class="site-footer-bar"></div>

</body>
</html>
